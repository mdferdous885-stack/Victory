const cv=document.getElementById('c'),cx=cv.getContext('2d'),$=i=>document.getElementById(i);
const W=1000,H=1152,WIN={x:29,y:68,w:852,h:782};
let frame=new Image(),photo=null,s=1,base=1,ox=0,oy=0,zoom=100;
frame.src=FRAME_SRC;frame.onload=()=>draw();
function reset(){if(!photo)return;base=Math.max(WIN.w/photo.width,WIN.h/photo.height);zoom=100;ox=0;oy=0;sync();draw()}
function sync(){$('z').value=zoom;$('zv').textContent=Math.round(zoom)+'%'}
function draw(){cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
 if(photo){const k=base*zoom/100,w=photo.width*k,h=photo.height*k;
  cx.drawImage(photo,WIN.x+WIN.w/2-w/2+ox,WIN.y+WIN.h/2-h/2+oy,w,h)}
 cx.drawImage(frame,0,0,W,H)}
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;
 const im=new Image();im.onload=()=>{photo=im;$('upl').classList.add('hid');$('ed').classList.remove('hid');reset()};
 im.src=URL.createObjectURL(f)};
$('chg').onclick=e=>{e.preventDefault();$('f').value='';$('f').click()};
$('z').oninput=e=>{zoom=+e.target.value;sync();draw()};
const zs=d=>{zoom=Math.min(400,Math.max(30,zoom+d));sync();draw()};
$('p').onclick=()=>zs(10);$('m').onclick=()=>zs(-10);$('rz').onclick=()=>{zoom=100;sync();draw()};
const mv=(x,y)=>{ox+=x;oy+=y;draw()};
$('u').onclick=()=>mv(0,-20);$('d').onclick=()=>mv(0,20);$('l').onclick=()=>mv(-20,0);$('r').onclick=()=>mv(20,0);
$('rp').onclick=()=>{ox=0;oy=0;draw()};
let drag=null;
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;const k=W/cv.getBoundingClientRect().width;ox+=(e.clientX-drag.x)*k;oy+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};draw()};
cv.onpointerup=cv.onpointercancel=()=>drag=null;
$('dl').onclick=()=>{cv.toBlob(b=>{const u=URL.createObjectURL(b);$('out').src=u;$('ov').classList.remove('hid');
 try{const a=document.createElement('a');a.href=u;a.download='victory-day-fkl.png';document.body.appendChild(a);a.click();a.remove()}catch(e){}},'image/png')};

function showOv(u){$('out').src=u;$('ov').classList.remove('hid')}
$('sh').onclick=()=>{cv.toBlob(async b=>{
 const f=new File([b],'victory-day-fkl.png',{type:'image/png'});
 try{
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'১৬ ডিসেম্বর – মহান বিজয় দিবস',text:'১৬ ডিসেম্বর – মহান বিজয় দিবস | FKL Spinning Ltd.'});return}
 }catch(e){if(e&&e.name==='AbortError')return}
 showOv(URL.createObjectURL(b))},'image/png')};
$('cls').onclick=()=>$('ov').classList.add('hid');
